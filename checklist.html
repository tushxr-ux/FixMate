<title>FixMate — Implementation Control Center</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #1A56DB;
  --blue-dark: #003fb1;
  --blue-light: #E8EFFC;
  --white: #ffffff;
  --navy: #12172b;
  --gray: #5b6478;
  --border: #dce3f5;
  --bg: #F5F8FF;
  --surface: #ffffff;
  --surface-2: #EEF3FE;
  --green: #0f7a3d;
  --green-bg: #dbf5e5;
  --amber: #92400e;
  --amber-bg: #fef3c7;
  --red: #991b1b;
  --red-bg: #fee2e2;
  --radius: 10px;
  --radius-lg: 16px;
  --radius-pill: 9999px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--navy); min-height: 100vh; }

header { background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%); color: #fff; padding: 32px 40px 28px; }
header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
header p { font-size: 14px; color: rgba(255,255,255,.75); margin-top: 4px; }

.progress-wrap { background: var(--surface); border-bottom: 1px solid var(--border); padding: 24px 40px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 12px rgba(26,86,219,.08); }
.stats { display: flex; gap: 32px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.stat .val { font-size: 24px; font-weight: 800; color: var(--blue); }
.stat .lbl { font-size: 11px; font-weight: 600; color: var(--gray); text-transform: uppercase; letter-spacing: .04em; }
.stat.done .val { color: var(--green); }
.stat.inprog .val { color: #b45309; }
.stat.pct .val { font-size: 28px; }
.prog-bar { height: 8px; background: var(--blue-light); border-radius: var(--radius-pill); overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--blue), var(--blue-dark)); border-radius: var(--radius-pill); transition: width .4s ease; }

main { max-width: 1100px; margin: 0 auto; padding: 32px 40px 80px; }

.phase { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 20px; overflow: hidden; }
.phase-header { display: flex; align-items: center; gap: 14px; padding: 16px 20px; cursor: pointer; user-select: none; background: var(--surface); transition: background .15s; }
.phase-header:hover { background: var(--surface-2); }
.phase-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-pill); background: var(--blue-light); color: var(--blue); flex-shrink: 0; }
.phase-title { font-size: 15px; font-weight: 700; flex: 1; }
.phase-count { font-size: 12px; color: var(--gray); }
.phase-chevron { font-size: 18px; color: var(--gray); transition: transform .2s; }
.phase.open .phase-chevron { transform: rotate(180deg); }
.phase-body { display: none; padding: 0 20px 16px; }
.phase.open .phase-body { display: block; }

.task { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.task:last-child { border-bottom: none; }
.task-check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; margin-top: 1px; transition: border-color .15s, background .15s; font-size: 13px; font-weight: 700; }
.task-check:hover { border-color: var(--blue); }
.task.done .task-check { background: var(--green); border-color: var(--green); color: #fff; }
.task.inprog .task-check { background: var(--amber-bg); border-color: #d97706; color: #92400e; }
.task-text { flex: 1; font-size: 14px; line-height: 1.5; }
.task.done .task-text { color: var(--gray); text-decoration: line-through; }
.task-actions { display: flex; gap: 6px; flex-shrink: 0; }
.task-btn { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: var(--radius-pill); border: 1px solid var(--border); background: var(--surface); color: var(--gray); cursor: pointer; transition: background .15s, color .15s; }
.task-btn:hover { background: var(--blue-light); color: var(--blue); border-color: var(--blue); }
.task-btn.done-btn { color: var(--green); border-color: var(--green-bg); }
.task-btn.done-btn:hover { background: var(--green-bg); }
.task-btn.prog-btn { color: #b45309; border-color: var(--amber-bg); }
.task-btn.prog-btn:hover { background: var(--amber-bg); }

.audit-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; font-size: 13px; line-height: 1.7; }
.audit-box h3 { font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--blue); }
.audit-box ul { padding-left: 18px; }
.audit-box li { margin-bottom: 3px; }
.gap-item { color: var(--red); }
.ok-item { color: var(--green); }

.legend { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 24px; font-size: 12px; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-chip { width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }

@media (max-width: 700px) {
  header, .progress-wrap, main { padding-left: 16px; padding-right: 16px; }
  .stats { gap: 16px; }
}
</style>
</head>

let state = {};

function load() { try { state = JSON.parse(localStorage.getItem(KEY)||'{}'); } catch(e) { state = {}; } }
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function getS(id) { return state[id]||'none'; }
function setS(id, s) { state[id]=s; save(); refresh(); }
function cycle(id) {
  const cur = getS(id);
  setS(id, cur==='none'?'inprog':cur==='inprog'?'done':'none');
}

function taskHTML(t) {
  const s = getS(t.id);
  const lbl = s==='done'?'&#10003;':s==='inprog'?'~':'';
  return `<div class="task ${s==='done'?'done':s==='inprog'?'inprog':''}" id="t${t.id}">
    <div class="task-check" onclick="cycle('${t.id}')" title="Click to cycle status">${lbl}</div>
    <div class="task-text">${t.text}</div>
    <div class="task-actions">
      <button class="task-btn prog-btn" onclick="setS('${t.id}','inprog')">~</button>
      <button class="task-btn done-btn" onclick="setS('${t.id}','done')">&#10003;</button>
    </div>
  </div>`;
}

function render() {
  load();
  const root = document.getElementById('phases-root');
  root.innerHTML = PHASES.map(ph => `
    <div class="phase ${ph.open?'open':''}" id="ph${ph.id}">
      <div class="phase-header" onclick="togglePhase('ph${ph.id}')">
        <span class="phase-badge">${ph.label}</span>
        <span class="phase-title">${ph.title}</span>
        <span class="phase-count" id="cnt${ph.id}"></span>
        <span class="phase-chevron">&#9660;</span>
      </div>
      <div class="phase-body">
        ${ph.audit ? AUDIT_HTML : ''}
        <div id="tasks${ph.id}">${ph.tasks.map(taskHTML).join('')}</div>
      </div>
    </div>
  `).join('');
  updateCounts();
}

function refresh() {
  PHASES.forEach(ph => {
    const cont = document.getElementById('tasks'+ph.id);
    if(cont) cont.innerHTML = ph.tasks.map(taskHTML).join('');
  });
  updateCounts();
}

function updateCounts() {
  let total=0, done=0, inprog=0;
  PHASES.forEach(ph => {
    let pd=0, pi=0;
    ph.tasks.forEach(t => {
      total++;
      const s=getS(t.id);
      if(s==='done'){done++;pd++;}
      if(s==='inprog'){inprog++;pi++;}
    });
    const el=document.getElementById('cnt'+ph.id);
    if(el) el.textContent = `${pd}/${ph.tasks.length} done${pi?` \xb7 ${pi} in progress`:''}`;
  });
  const rem = total-done-inprog;
  const pct = total>0?Math.round((done/total)*100):0;
  document.getElementById('pctVal').textContent = pct+'%';
  document.getElementById('doneVal').textContent = done;
  document.getElementById('inprogVal').textContent = inprog;
  document.getElementById('remainVal').textContent = rem;
  document.getElementById('totalVal').textContent = total;
  document.getElementById('progFill').style.width = pct+'%';
}
